<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This site isn’t available</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef1f5;
    --text: #1b2330;
    --muted: #596478;
    --line: #c9d0db;
    --accent: #2b57d6;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d;
      --text: #e6e9ee;
      --muted: #98a3b3;
      --line: #2c3442;
      --accent: #86a6ff;
      --accent-text: #0e1320;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
  }
  main { width: 100%; max-width: 34rem; }
  .icon { width: 7.5rem; height: auto; margin-bottom: 1.75rem; color: var(--muted); }
  .icon .gap { color: var(--accent); }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.75rem, 5vw, 2.25rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  p { margin: 0 0 1.5rem; max-width: 30rem; color: var(--muted); font-size: 1.0625rem; }
  ul { margin: 0 0 2rem; padding: 0 0 0 1.1rem; max-width: 30rem; color: var(--muted); }
  li { margin-bottom: 0.35rem; padding-left: 0.2rem; }
  li::marker { color: var(--line); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 1.75rem; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 0.7rem 1.4rem;
    border: 0;
    border-radius: 0.5rem;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 120 56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A disconnected plug">
    <path d="M4 28h22"/>
    <rect x="26" y="14" width="22" height="28" rx="5"/>
    <path d="M48 22h10M48 34h10"/>
    <g class="gap" stroke-dasharray="1 7">
      <path d="M62 28h14"/>
    </g>
    <path d="M80 22h10M80 34h10"/>
    <rect x="90" y="14" width="22" height="28" rx="5"/>
    <path d="M112 28h4"/>
  </svg>

  <h1>This site isn’t available</h1>
  <p>We couldn’t connect to the server. The site may be down for maintenance, or your connection may have dropped.</p>

  <ul>
    <li>Check that your device is online.</li>
    <li>Check the address for typos.</li>
    <li>Wait a few minutes, then try again.</li>
  </ul>

  <hr>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
